<app-header />
<main>
  @if (trip(); as current) {
    <a routerLink="/trips" class="trip-page__back">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
      Your trips
    </a>
    <div class="trip-page__header">
      <h1 class="trip-page__title">{{ current.name }}</h1>
      <button
        type="button"
        class="trip-page__delete"
        [attr.aria-label]="'Delete trip ' + current.name"
        (click)="openDelete()"
      >
        Delete
      </button>
    </div>
    <app-trip-view-switch [view]="view()" (viewChange)="view.set($event)" />
    @if (view() === 'expenses') {
      <!-- DOM order is the reading and tab order: tiles, Expenses, Balances, then People (F5.R8, F5.R5). -->
      <div class="trip-page__layout">
        <app-summary-tiles [tripId]="current.id" (tripGone)="onTripGone()" />
        <app-expenses-panel [tripId]="current.id" (tripGone)="onTripGone()" />
        <app-balances-panel [tripId]="current.id" (tripGone)="onTripGone()" />
        <app-people-panel [tripId]="current.id" (tripGone)="onTripGone()" (countChanged)="onPeopleCountChanged($event)" />
      </div>
    } @else {
      <app-settle-up-view [tripId]="current.id" (tripGone)="onTripGone()" />
    }
  } @else if (notFound()) {
    <p role="alert">{{ notFoundMessage }}</p>
    <p><a routerLink="/trips">Your trips</a></p>
  } @else if (failed()) {
    <p role="alert">{{ genericMessage }}</p>
  }
</main>
