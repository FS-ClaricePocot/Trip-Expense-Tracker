<div class="shares">
  <h2 id="shares-title" class="shares__title">Shares for {{ data.description }}</h2>
  <ul class="shares__list" aria-label="Shares">
    @for (participant of data.participants; track participant.id) {
      <li class="shares__item">
        <span class="shares__name">{{ participant.name }}</span>
        <span class="shares__amount">{{ formatCents(participant.shareCents) }}</span>
      </li>
    }
  </ul>
  <p class="shares__total">
    <span>Total</span>
    <span class="shares__total-amount">{{ formatCents(data.amountCents) }}</span>
  </p>
  <div class="shares__actions">
    <button type="button" class="shares__close" (click)="close()">Close</button>
  </div>
</div>
