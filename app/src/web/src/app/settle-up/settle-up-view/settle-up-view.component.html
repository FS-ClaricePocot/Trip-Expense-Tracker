<section class="settle-up-view" aria-label="Settle up">
  @if (loading()) {
    <p>Loading settle up…</p>
  } @else if (failed()) {
    <p role="alert">{{ genericMessage }}</p>
  } @else if (settleUp(); as current) {
    <app-summary-tiles-settle [summary]="current" />
  }
  <p class="settle-up-view__status" role="status">{{ notice() }}</p>
  <app-suggested-payments-panel [tripId]="tripId()" (tripGone)="tripGone.emit()" (markPaid)="openMark($event)" />
  <app-balances-panel [tripId]="tripId()" (tripGone)="tripGone.emit()" />
</section>
